# Dokploy template for the Semantius PostgREST stack.
# Variables are generated per deployment; env is written to the stack's .env.
#
# DOMAINS ATTACHED AFTER DEPLOY (Dokploy's "Add Domain") work with no env edit:
# the idp derives the issuer per request (IDP_DYNAMIC_ISSUER=true below — safe
# under Dokploy's Traefik, which overwrites X-Forwarded-Host with the host it
# matched, routes only configured hosts, and is the only path to the
# containers), the SPA's redirect URIs follow the request host
# (PUBLIC_WEB_ORIGIN=https://{host}), and the SPA's discovery URL and the docs'
# spec URL are relative. The ONE thing that stays on the imported domain is
# E-MAIL LINKS (password reset, verification): they are built from IDP_BASE_URL
# by design — that is what keeps a forged Host out of a reset link — so edit
# that env once after attaching your real domain.

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
authenticator_password = "${password:32}"
# Signs the identity provider's sessions and encrypts its JWT signing keys at
# rest. Generated once per deployment and never rotated casually: changing it
# logs every user out and makes the stored signing keys undecryptable.
idp_secret = "${password:64}"

[config]
# No bind mounts: the Caddyfile and the idp's config files ship inside
# docker-compose.yml (configs.content).
mounts = []
env = [
  # The stack brings its OWN issuer — the `idp` service, mounted at /idp on the
  # front door — so a one-click deploy has a complete auth story with nothing to
  # register anywhere. On first visit, https://${main_domain}/idp serves a setup
  # page: whoever completes it becomes the first administrator.
  #
  # No VITE_OAUTH_CONFIG here on purpose: the SPA's default discovery URL is
  # RELATIVE (/.well-known/openid-configuration, served from the origin root by
  # caddy), so it follows whatever domain the deployment is opened on.
  "VITE_OAUTH_CLIENT_ID=public-client",
  # The keys PostgREST validates tokens against: the idp, IN-NETWORK — the one
  # address that never changes with domains. Explicit rather than derived from
  # discovery, because the jwks_uri the idp advertises carries a public URL,
  # which the jwks-fetch container cannot resolve.
  "JWKS_URL=http://idp:3000/idp/.well-known/jwks.json",
  "IDP_SECRET=${idp_secret}",
  # The CANONICAL issuer, and the base of every e-mail link. Browser-facing
  # flows follow the request host (IDP_DYNAMIC_ISSUER below); update THIS once
  # after attaching your own domain, for the e-mail links.
  "IDP_BASE_URL=https://${main_domain}/idp",
  # Derive the issuer per request from the arriving host. Safe under Dokploy's
  # Traefik: every hop overwrites X-Forwarded-Host with the host it matched,
  # only configured hosts are forwarded, the set of hosts is closed, and
  # nothing reaches the containers around it.
  "IDP_DYNAMIC_ISSUER=true",
  # The SPA's redirect URIs, templated on the request host. {host} is the
  # IDP's per-request template — expanded by the idp during authorization, NOT
  # by Dokploy (Dokploy substitutes ${...}; the braces without a dollar pass
  # through). Not a wildcard: `*` stays refused, and {host} must be the whole
  # host component.
  "PUBLIC_WEB_ORIGIN=https://{host}",
  "POSTGRES_PASSWORD=${postgres_password}",
  "SEMANTIUS_AUTHENTICATOR_PASSWORD=${authenticator_password}",
  "POSTGRES_DB=semantius",
  "SEMANTIUS_DB_VERSION=latest",
  "SEMANTIUS_APP_VERSION=latest",
  "SEMANTIUS_IDP_VERSION=latest",
  # What the OpenAPI spec ADVERTISES (PGRST_OPENAPI_SERVER_PROXY_URI) —
  # absolute by necessity, PostgREST parses it into the spec's host/basePath.
  # The docs page loads the spec RELATIVELY, so on a later-attached domain the
  # docs still render; "Test Request" calls this host until it is updated.
  # /gateway/rest is the idp's authenticating proxy in front of PostgREST — an
  # API key is enough there, which is what makes Scalar's "Test Request" usable
  # on a deployment.
  "PUBLIC_API_URL=https://${main_domain}/gateway/rest",
  # Load the Northwind demo module on first init so the deploy has data to show.
  # Remove this line for an empty database.
  "NWIND=TRUE",
]

# Traefik routes the domain to the caddy front door; caddy fans out to the SPA,
# PostgREST (/rest/*, plus /gateway/rest/* for the same API through the idp's
# authenticating proxy), Scalar (/api-docs/*) and the identity provider (/idp/*
# plus the discovery documents at /.well-known/*). Domains added here later are
# picked up per request — see the header comment.
[[config.domains]]
serviceName = "caddy"
port = 80
host = "${main_domain}"
