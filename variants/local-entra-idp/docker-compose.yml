# Semantius with MICROSOFT ENTRA ID: PostgreSQL with the pg_semantius extension,
# a PostgREST HTTP API, its OpenAPI docs and the web app, behind one Caddy front
# door. No identity provider is included — your Entra tenant signs the tokens,
# and this stack only verifies them.

# IT WILL NOT START UNTIL IT IS CONFIGURED. Four steps, in README.md:

#   1. ./setup-env.sh        create .env (Windows: setup-env.cmd)
#   2. ./setup-entra.ps1     register the three applications in your tenant
#                            and write their ids into .env — or do it in the
#                            Entra admin center and fill .env yourself
#   3. assign people to the `authenticated` app role, in Entra
#   4. ./up.sh               start (Windows: up.cmd)

# Everything Entra needs that is the same for every tenant is already set below:
# the `.roles[0]` claim key, the empty JWKS_URL that derives signing keys from
# the discovery document, and the account menu. What belongs in .env is only
# yours — the tenant, the app ids, the audience.

# NOT INCLUDED, because the identity provider is not: the /idp and /gateway
# routes, API keys, and the API docs' one-click "Test Request" (paste a bearer
# token into the docs' Authentication box instead). Signing keys are refreshed
# manually — README.md says when and how.

# GENERATED from ../../templates by scripts/build.mjs. Edits here are overwritten
# by the next build; change the template instead.


name: semantius

# PostgREST stack: PostgreSQL 18 + the pg_semantius extension, fronted by
# PostgREST (HTTP + OpenAPI) with a Scalar docs site. NO PostgreSQL-native OAuth —
# PostgREST verifies the OIDC bearer token against the issuer JWKS and connects to
# the DB over SCRAM as `semantius_authenticator`, SET ROLE-ing into `authenticated`
# (valid token) or `anon` (no token) per request.
#
#
# Its OWN compose project (semantius, set by `name:` above) on its OWN host
# ports, so it runs alongside the pgdocker CLI (semantius-cli, 5432) and ext
# (semantius-ext, 5433) stacks without colliding. Each container is named for what
# it IS rather than for its compose service — semantius-postgres / -pgbouncer /
# -idp / -jwks / -api / -docs / -app / -caddy — which is what `docker ps` and
# `docker logs` want. Two names therefore differ from their service on purpose:
# the SPA is the `nginx` service (what it runs) in the `-app` container (what it
# serves, and `-app` rather than `-web` because the shorter name is taken on some
# dev machines by the semantius-web repo's own stack); the front door is the
# `semantius` service — the name a deployment platform shows when you attach a
# domain to this stack — in the `-caddy` container. Bring it up with create.sh / .cmd (fresh database) or up.sh / .cmd
# (recreates the containers, keeps the data).
#
# FRONT DOOR: the `semantius` service (host port WEB_PORT, default 3000) is the
# single public entrypoint — `/` serves the web app (`nginx`), `/rest/*` proxies to
# PostgREST and `/api-docs/*` to Scalar, both with the prefix stripped.
# The routes live in the sibling ./Caddyfile,
# bind-mounted as a REGULAR file: edit it and `docker compose restart semantius` to
# apply. Only the DATA TIER keeps host ports here (postgres, pgbouncer — real
# clients, no HTTP route the front door could serve); every HTTP service is reached
# through the front door.
#
# THIS file is a TEMPLATE, not a stack you run. Every runnable folder under
# ../variants/ is GENERATED from it by `./build.sh`, which subtracts the
# parts a variant does not include: `x-semantius-feature:` keys mark nodes,
# `# >>> feature:<name>` / `# <<< feature:<name>` pairs mark comment regions and
# the sibling text files. Edit HERE and regenerate — never a file under
# ../variants/, whose contents the next build overwrites.

services:
  # --- PostgreSQL 18 + extension --------------------------------------------
  postgres:
    # Self-contained image: PostgreSQL 18 with the extension INSTALLED, plus
    # pg_hba, the roles, the authenticator LOGIN, and an optional Northwind demo
    # module all baked in. NOTHING is mounted from the host — this stack is just
    # this compose file + .env (a copy-paste Dokploy template). It is pulled from
    # GHCR; pin the version via SEMANTIUS_DB_VERSION. The image is built from
    # docker-postgres/ in github.com/semantius/semantius.
    image: ghcr.io/semantius/postgres:${SEMANTIUS_DB_VERSION:-latest}
    container_name: semantius-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-semantius}
      # Read by the image's baked 20-authenticator-login.sh AND by PostgREST below
      # (PGRST_DB_URI) — keep the two in sync. No default, like the other two
      # secrets: a fallback here would let a deployment that simply FORGOT this
      # variable boot on a published password instead of refusing to start.
      SEMANTIUS_AUTHENTICATOR_PASSWORD: ${SEMANTIUS_AUTHENTICATOR_PASSWORD:?set SEMANTIUS_AUTHENTICATOR_PASSWORD in .env (./setup-env.sh generates one)}
      # Set to any value (e.g. TRUE) to load the optional Northwind demo module on
      # first init (the image's baked 40-nwind.sh). Leave unset for an empty DB.
      # Only takes effect on a FRESH data volume — init scripts run once.
      NWIND: ${NWIND:-}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `-h 127.0.0.1` FORCES A TCP CHECK, and that is the whole point. A bare
      # `pg_isready` talks over the unix socket, which starts answering during the
      # image's FIRST-INIT phase — while the server runs with listen_addresses=''
      # and refuses every TCP client. On a fresh volume that gap is over a minute,
      # and `depends_on: service_healthy` hands it to services that then fail to
      # connect (PostgREST survives it by retrying in a loop; the idp does not).
      # start_period covers the init — extension install, roles, the optional
      # NWIND load — without those failures counting toward `retries`.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${POSTGRES_DB:-semantius}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # --- PgBouncer (pooled endpoint for external apps + the idp) ---------------
  # Transaction-pooled endpoint, for transaction-pooling-safe usage only (the SET
  # LOCAL ROLE pattern, see pgdocker/README.md). It pools TWO logins:
  #   `semantius_authenticator`  external apps talking SQL directly, on the
  #                              published PGBOUNCER_PORT;
  # PostgREST still connects to postgres directly as well: it needs LISTEN/NOTIFY
  # (PGRST_DB_CHANNEL), which transaction pooling does not support.
  #
  # DATABASE_URLS (plural) is edoburu/pgbouncer's MULTI-USER form: the entrypoint
  # parses each comma-separated URL and appends one userlist.txt entry per distinct
  # user — env only, no mounted userlist to keep in step. Two caveats it earns:
  # that parser is naive (grep/cut), so every password spliced in here must be
  # URL-SAFE (no @ : / ? # or spaces); and both URLs name the same database, so
  # `[databases]` gets a duplicate key — harmless, the two entries differ only in
  # `auth_user`, which goes unused once both users are in the userlist.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    pull_policy: always
    container_name: semantius-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URLS: "postgres://semantius_authenticator:${SEMANTIUS_AUTHENTICATOR_PASSWORD:?set SEMANTIUS_AUTHENTICATOR_PASSWORD in .env (./setup-env.sh generates one)}@postgres:5432/${POSTGRES_DB:-semantius},postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-semantius}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      # PgBouncer REJECTS a startup parameter it does not know, with a FATAL
      # "unsupported startup parameter"; listing one here makes it ignore the
      # parameter instead of the connection. `search_path` is on the list because
      # the idp's driver sends one as a best-effort convenience — every query it
      # emits is schema-qualified, so dropping it changes nothing — and without
      # this every idp query through the pooler dies at connect. The image's own
      # default is `extra_float_digits` alone, so it has to be repeated here.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"

  # --- One-shot: fetch the issuer JWKS to a file PostgREST can read ----------
  # PostgREST CANNOT fetch a JWKS from a URL; jwt-secret only takes inline JSON or
  # @/path/to/file. So fetch it once at startup into the shared `jwks` volume.
  # Runs as root (user 0:0) so it can write to the fresh named volume (owned by
  # root); curl writes jwks.json world-readable, so PostgREST (a different user)
  # can read it.
  #
  # KEYS URL: JWKS_URL, when set, is fetched directly.
  # An empty JWKS_URL makes this service DERIVE the keys
  # URL from the discovery document's `jwks_uri`, so the issuer is named once.
  #
  # LIMITATION: fetched ONCE per start. When the issuer ROTATES signing keys, tokens
  # signed by a new key fail until this is re-run AND PostgREST is restarted to
  # re-read the file — do both with ./jwks-refresh.sh (.cmd). A restart, not
  # a reload signal, is required: the key comes from the PGRST_JWT_SECRET env var,
  # which PostgREST does not re-read on a config reload. Most IdPs rotate slowly, so
  # on demand is enough; schedule the refresh (daily cron) for a fast-rotating IdP.
  # Fail-closed: if the issuer/discovery is unreachable, this exits non-zero and
  # PostgREST won't start (its depends_on service_completed_successfully).
  jwks-fetch:
    image: curlimages/curl:latest
    pull_policy: always
    container_name: semantius-jwks
    user: "0:0"
    restart: "no"
    environment:
      # Defaults to the bundled idp, in-network. `-` and NOT `:-`, deliberately:
      # the default applies only when JWKS_URL is UNSET, so an EMPTY `JWKS_URL=`
      # in .env survives as empty and selects the derive-from-discovery path
      # below. With `:-` an empty value would silently take the default back and
      # the external-issuer route would be unreachable.
      JWKS_URL: ${JWKS_URL-}
      # Only consulted when JWKS_URL is empty — the external-issuer path, where
      # .env sets VITE_OAUTH_CONFIG to that issuer's discovery URL. Here it must
      # be ABSOLUTE: this container curls it directly, so the relative default
      # the `web` service uses (resolved by the browser) is meaningless to it.
      # The absolute fallback below is therefore kept, even though it names the
      # front door's host-side address — it only fires on the misconfiguration
      # "JWKS_URL emptied but no discovery URL set", where failing the fetch
      # loudly is the job.
      VITE_OAUTH_CONFIG: ${VITE_OAUTH_CONFIG:?set VITE_OAUTH_CONFIG in .env}
    volumes:
      - jwks:/jwks
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -e
        url="$${JWKS_URL}"
        if [ -z "$${url}" ]; then
          if [ -z "$${VITE_OAUTH_CONFIG}" ]; then
            echo "ERROR: set JWKS_URL, or VITE_OAUTH_CONFIG (the issuer's ABSOLUTE OIDC discovery URL — this container fetches it directly, so a relative value cannot work here)." >&2
            exit 1
          fi
          echo "JWKS_URL empty — discovering jwks_uri from $${VITE_OAUTH_CONFIG} ..."
          url="$$(curl -fsS --retry 5 --retry-connrefused --retry-all-errors "$${VITE_OAUTH_CONFIG}" \
                  | tr -d '[:space:]' | sed 's/.*"jwks_uri":"//; s/".*//')"
          case "$${url}" in
            http://*|https://*) echo "Discovered jwks_uri: $${url}" ;;
            *) echo "ERROR: no jwks_uri in the discovery document at $${VITE_OAUTH_CONFIG} — is that an ABSOLUTE URL this container can fetch? (A relative discovery URL only works for the browser.)" >&2; exit 1 ;;
          esac
        fi
        echo "Fetching JWKS from $${url} ..."
        # --retry-all-errors as well as --retry-connrefused: an issuer that is
        # listening but not yet able to serve keys answers 500, and without this
        # curl retries the connection failure but not the HTTP error.
        curl -fsS --retry 5 --retry-connrefused --retry-all-errors "$${url}" -o /jwks/jwks.json
        echo "JWKS written to /jwks/jwks.json:"
        cat /jwks/jwks.json

  # --- PostgREST -------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:latest
    pull_policy: always
    container_name: semantius-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jwks-fetch:
        condition: service_completed_successfully
    environment:
      # Connect as the authenticator; PostgREST SET ROLEs into authenticated/anon.
      # Password must match SEMANTIUS_AUTHENTICATOR_PASSWORD above.
      PGRST_DB_URI: "postgres://semantius_authenticator:${SEMANTIUS_AUTHENTICATOR_PASSWORD:?set SEMANTIUS_AUTHENTICATOR_PASSWORD in .env (./setup-env.sh generates one)}@postgres:5432/${POSTGRES_DB:-semantius}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "anon"
      # JWKS from a FILE (PostgREST can't take a URL). @-prefix = read from file.
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      # The JWT `role` claim selects the DB role (default claim key = .role). The
      # bundled idp mints "role":"authenticated" into every access token (a static
      # claim — `jwt.claims` in semantius-idp-config/config.jsonc), so it maps automatically;
      # an external issuer has to be configured to emit the same claim.
      #
      # A VARIABLE because some issuers cannot emit a claim called `role` at all.
      # Microsoft Entra ID is the case: `role` and `roles` are both in its
      # restricted claim set, so an app role named `authenticated` arrives as
      # "roles":["authenticated"] and the key has to be `.roles[0]`. Write the
      # path with NO leading `$` — compose would try to interpolate it.
      # pg_semantius reads the same array in rbac.uid() when a `role` claim is
      # missing, so both ends of the token agree; that needs a SEMANTIUS_DB_VERSION
      # carrying it (see external-idp/entra/README.md).
      PGRST_JWT_ROLE_CLAIM_KEY: "${PGRST_JWT_ROLE_CLAIM_KEY:-.roles[0]}"
      # Emit the FULL OpenAPI spec regardless of the requesting role's privileges,
      # so the token-less docs site sees every endpoint while `anon` still has no
      # data access (locked down in init/12-anon-role.sh).
      PGRST_OPENAPI_MODE: "ignore-privileges"
      # Include securityDefinitions (JWT bearer, Authorization header) in the spec
      # so the Scalar docs render an "Authentication" box for pasting a token.
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      # Honour the CLI's `NOTIFY pgrst, 'reload schema'` after each migration.
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_DB_CHANNEL: "pgrst"
      # Keep pooled connections warm through normal pauses. The 30 s default makes the
      # next N requests after any pause (N = pooled connections) open fresh backends at
      # ~290 ms each. 1800 matches db-pool-max-lifetime, so a higher value adds nothing.
      PGRST_DB_POOL_MAX_IDLETIME: "${PGRST_DB_POOL_MAX_IDLETIME:-1800}"
      PGRST_SERVER_PORT: "3000"
      # The host the spec advertises to clients. Without this PostgREST emits its
      # bind address (0.0.0.0:3000), so the docs' "Test Request" calls
      # http://0.0.0.0:3000/... which the browser rejects (ERR_ADDRESS_INVALID).
      # The browser resolves this URL, so it must be browser-reachable — NOT the
      # in-network `postgrest` hostname. The default is this stack's OWN front door
      # (the front door on WEB_PORT), on the route DOCS_API_ROUTE names.
      # Going live, set PUBLIC_API_URL to the PUBLIC front-door URL INCLUDING
      # that prefix. See README / .env.example.
      #
      # This value CANNOT be relative: PostgREST parses it into Swagger 2.0's
      # separate host/basePath/schemes fields and treats a malformed value as
      # fatal. (The Scalar docs' spec `url` below is a different setting with a
      # RELATIVE default — the browser resolves that one.) So on a domain
      # attached after deploy, the docs page loads but "Test Request" calls the
      # host advertised HERE until PUBLIC_API_URL is updated.
      # DOCS_API_ROUTE is the route the docs use, in ONE place: it is the inner
      # default here and of DOCS_SPEC_URL on `scalar` below. A variant without
      # the gateway sets it to /rest and both follow.
      PGRST_OPENAPI_SERVER_PROXY_URI: "${PUBLIC_API_URL:-http://localhost:${WEB_PORT:-3000}${DOCS_API_ROUTE:-/rest}}"
      # Empty by default: rbac.uid() enforces aud in-DB (same as bearer mode),
      # and only when _settings.jwt_aud is seeded. Set this to one of the token's
      # aud values to also check at this layer — cheaper, and it refuses the
      # token before any database work happens.
      #
      # NOT optional for an issuer whose signing keys are shared between its
      # tenants — Entra ID is one: nothing here validates `iss`, so without an
      # audience check ANY token that issuer ever minted verifies against the
      # JWKS this stack downloaded, including one minted in somebody else's
      # tenant. The audience is then the only thing tying a token to YOUR
      # registration. See external-idp/entra/README.md.
      PGRST_JWT_AUD: "${PGRST_JWT_AUD:?set PGRST_JWT_AUD in .env}"
    volumes:
      - jwks:/jwks:ro

  # --- Scalar API reference (OpenAPI docs) -----------------------------------
  # Renders PostgREST's Swagger 2.0 spec. The `url` is fetched by the BROWSER
  # from the /api-docs/ page, so a RELATIVE default is exactly right: it resolves
  # against whatever origin the docs are open on, which Caddy routes to the
  # gateway on every host it fronts — a domain attached after deploy needs no
  # edit for the docs to load. This is a DIFFERENT setting from
  # PGRST_OPENAPI_SERVER_PROXY_URI above, which cannot be relative (PostgREST
  # parses it into Swagger host/basePath) and therefore stays absolute — so on a
  # freshly attached domain the spec loads here while "Test Request" still calls
  # the host the spec advertises. Set DOCS_SPEC_URL only to point the docs at a
  # spec somewhere else entirely.
  #
  # One more thing is needed for "Test Request" to work, and it lives in the
  # ../Caddyfile: Scalar sends EVERY content type the spec declares in one Accept
  # header, which makes PostgREST answer 406 PGRST116 on every multi-row endpoint.
  # See the @pgrstDocsAccept rule there.
  #
  # Reached through the front door at /api-docs/ this is same-origin with the
  # spec, so it does not depend on PostgREST's permissive CORS. No host port —
  # the front door is the only route in.
  scalar:
    image: scalarapi/api-reference:latest
    pull_policy: always
    container_name: semantius-docs
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_started
    environment:
      API_REFERENCE_CONFIG: '{"sources":[{"url":"${DOCS_SPEC_URL:-${DOCS_API_ROUTE:-/rest}}/","title":"Semantius API"}]}'

  # --- Web app -------------------------------------------------------------
  # The web app: a static single-page build (nginx, container port 80). SPA ONLY — it does no
  # proxying of its own; the `semantius` front door below routes /rest/* and /api-docs/*
  # and falls through to here for everything else. Deliberately NOT published on a
  # host port — reach it through the front door on WEB_PORT. Runtime config is generated
  # into config.js at container start from the VITE_* env below (the image's
  # gen-config.sh), so one image serves every environment.
  nginx:
    image: ghcr.io/semantius/semantius-app:${SEMANTIUS_APP_VERSION:-latest}
    # Re-pull :latest on every `up` (create). Without this, compose only
    # pulls when the image is missing locally, so create would keep running a stale
    # cached SPA. NOT set on `postgres`, which is built locally by build.sh.
    # Same escape hatch as the idp's IDP_PULL_POLICY: to run an image you built
    # yourself (semantius-app's docker/build.sh tags `semantius-app:local`;
    # retag it under the ghcr name), point SEMANTIUS_APP_VERSION at that tag
    # AND set APP_PULL_POLICY=missing — otherwise the pull replaces your build
    # with the registry's copy of the same tag, or fails outright on a tag
    # never pushed.
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: semantius-app
    restart: unless-stopped
    environment:
      # Same-origin API base: the browser calls http://<host>:${WEB_PORT}/rest/...
      # and Caddy proxies /rest/* -> postgrest:3000 with the prefix stripped, so no
      # CORS and no need to publish PostgREST's port. Doesn't change going live.
      #
      # The DIRECT route, not /gateway/rest: the SPA holds a real OAuth access
      # token and has no use for the gateway's API-key exchange, so there is no
      # reason to put a second proxy hop in front of every call it makes. The
      # gateway route is for the docs and for key-holding scripts.
      VITE_API_BASE_URL: /rest
      # OIDC discovery URL + client id — the SPA resolves the OAuth endpoints from
      # this at boot. Both default to the BUNDLED idp. The discovery default is
      # RELATIVE on purpose: the SPA fetch()es it, so a relative URL resolves
      # against window.location.origin — and Caddy serves the document from the
      # origin root on EVERY host it fronts, so a domain attached after deploy
      # discovers the issuer with no env edit. Replacing the issuer, point
      # VITE_OAUTH_CONFIG at yours — ABSOLUTE, because the same variable also
      # feeds jwks-fetch above, which curls it directly (and see JWKS_URL there).
      VITE_OAUTH_CONFIG: ${VITE_OAUTH_CONFIG:?set VITE_OAUTH_CONFIG in .env}
      VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID:?set VITE_OAUTH_CLIENT_ID in .env}
      # The scopes the SPA asks for. EMPTY is right for the bundled idp: the SPA
      # then derives them from the discovery document, which is exactly what its
      # own issuer advertises. An external issuer usually needs the API named
      # here — with Entra ID, a scope that does not include
      # `api://<api-app-id>/<scope>` yields a Microsoft Graph token, whose
      # signature this stack cannot verify. Include `offline_access` too, or
      # every token expiry becomes a full-page redirect.
      VITE_OAUTH_SCOPE: ${VITE_OAUTH_SCOPE:?set VITE_OAUTH_SCOPE in .env}
      # Where the SPA reads the signed-in user's name and e-mail. EMPTY means
      # "take it from the discovery document", which is right for the bundled
      # idp and WRONG for an issuer whose userinfo endpoint does not accept the
      # token minted for THIS API: Entra ID advertises Microsoft Graph's
      # endpoint, Graph refuses a token issued for your own API, and the SPA
      # turns that refusal into a blocking error page. Pointing this at any
      # same-origin URL that answers a GET with JSON is the stopgap until the
      # app treats userinfo as optional and falls back to the id token (which
      # carries `name` and `email` already). Overriding it here does NOT change
      # who you are — identity comes from the access token's `sub`.
      VITE_OAUTH_USERINFO_ENDPOINT: ${VITE_OAUTH_USERINFO_ENDPOINT:-}
      # The RFC 8707 resource the SPA asks its access tokens to be issued FOR —
      # it becomes their `aud`. LOAD-BEARING: the SPA always sends one, falling
      # back to a built-in placeholder (`web://api`) when this is empty, and the
      # idp rejects a resource it has never heard of with
      # `invalid_target: requested resource not authorized` — a "Login Error" on
      # the callback page and nothing in the SPA to explain it. So name the idp's
      # registered default audience: the FIXED URI semantius://api (`jwt.audience`
      # in semantius-idp-config/config.jsonc, same default). Fixed and host-independent on
      # purpose — an audience derived from the issuer goes stale the moment a
      # domain is attached after deploy, and an unregistered audience is exactly
      # that bare "Login Error". Override BOTH sides together via
      # IDP_JWT_AUDIENCE in .env; with an external issuer, set
      # VITE_OAUTH_AUDIENCE alone to the audience that issuer expects — or to
      # its issuer URL if it has no separate API audience.
      # `-` and not `:-` again: an explicitly EMPTY VITE_OAUTH_AUDIENCE has to
      # reach the SPA as empty, which is how you ask for its own built-in fallback.
      VITE_OAUTH_AUDIENCE: ${VITE_OAUTH_AUDIENCE:?set VITE_OAUTH_AUDIENCE in .env}
      # SINGLE SPACE — LOAD-BEARING, do not "tidy" it to "" or delete the line. The
      # SPA's cloud control plane is opt-OUT: an UNSET **or EMPTY** value still
      # activates it (the runtime-env reader ignores empty strings and falls through
      # to the build-time default https://app.semantius.com), which sends the SPA to
      # api.semantius.cloud for a tenant lookup -> blocking boot error when
      # self-hosted. A whitespace value survives that filter and .trim()s to "" in
      # the app -> true self-hosted mode (OAuth endpoints from VITE_OAUTH_CONFIG
      # discovery, the API from VITE_API_BASE_URL).
      VITE_CONTROL_PLANE_URL: " "
      # Which built-in user menu the SPA renders: cloud | self_hosted | custom.
      # UNSET OR EMPTY MEANS `cloud`, which shows the hosted account/billing
      # entries that do not exist here — so this stack pins `self_hosted`, the
      # same reason VITE_CONTROL_PLANE_URL above is pinned. Not .env-driven:
      # this deployment IS the self-hosted backend. `custom` is the escape
      # hatch and needs VITE_UI_CUSTOMIZER (a JSON user menu) set alongside it;
      # any other value is a hard config error and the SPA refuses to boot.
      # A VARIABLE, because `self_hosted` is only true while the bundled idp is
      # part of the stack: that menu links to /idp/account and /idp/admin, and
      # with an external issuer those routes are either gone or — worse, while
      # the idp is still running — a SECOND identity with its own session
      # cookie, which shows the wrong user and signs you out of the wrong
      # system. The external-idp variant sets `custom` with a VITE_UI_CUSTOMIZER
      # menu instead. `Sign out` is rendered by the app itself and survives an
      # empty menu.
      VITE_BACKEND_TYPE: ${VITE_BACKEND_TYPE:-custom}
      # Only read when VITE_BACKEND_TYPE=custom (for the menu; its `locales` key
      # is read either way). `{"user":{"menu":[]}}` is the minimal value: no
      # extra entries, just the account chip and Sign out.
      VITE_UI_CUSTOMIZER: ${VITE_UI_CUSTOMIZER:-{"user":{"menu":[{"title":"Microsoft account","url":"https://myaccount.microsoft.com/","target":"newtab"}]}}}
      # Ignore the image's baked demo placeholders so a missing var fails loudly
      # instead of silently using .env.example defaults (e.g. your-postgrest-api.com).
      ENV_FILE: /dev/null
    healthcheck:
      # busybox wget — the nginx:alpine base has no curl.
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Caddy front door ------------------------------------------------------
  # The single public entrypoint. Routes (see the sibling ./Caddyfile):
  #   /              -> nginx:80        (the SPA)
  #   /rest/*        -> postgrest:3000  (prefix stripped by handle_path)
  #   /gateway/*     -> idp:3000        (the idp's authenticating proxy; /gateway/rest
  #                                      fronts that same PostgREST)
  #   /api-docs/*    -> scalar:8080     (prefix stripped by handle_path)
  #   /idp/*         -> idp:3000        (prefix KEPT — it is part of the issuer URL)
  #   /.well-known/* -> idp:3000        (rewritten under /idp: the issuer's metadata
  #                                      has to live at the origin root)
  # No depends_on: Caddy re-resolves upstream DNS per request, so an upstream that
  # hasn't started yet is a brief 502 that self-heals — no start-order coupling.
  semantius:
    image: caddy:2-alpine
    pull_policy: always
    container_name: semantius-caddy
    restart: unless-stopped
    environment:
      # ":80" = plain HTTP (local, or TLS terminated by Dokploy/Traefik in front).
      # Set a bare domain in .env for Caddy auto-HTTPS on a bare VPS (then publish
      # 80:80 + 443:443 below instead of WEB_PORT).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # The CIDRs whose X-Forwarded-* headers Caddy believes -- the proxy IN
      # FRONT of it, and nothing else (see the Caddyfile's global block). The
      # default trusts only loopback, i.e. nobody, which is right when Caddy is
      # the edge. The Dokploy template sets Docker's address pools so Traefik
      # is trusted and per-user throttling works there.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      # Regular file — edit it and `docker compose restart semantius` to apply. The
      # dokploy build embeds it into the generated compose instead (no bind mounts
      # there), so regenerate after every change to keep the two in sync.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificate/ACME store + autosaved config — only meaningful when
      # SITE_ADDRESS is a real domain (auto-HTTPS); harmless otherwise.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  jwks:
  caddy_data:
  caddy_config:
